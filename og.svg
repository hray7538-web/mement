<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#faf8f5"/>
<circle cx="1040" cy="60" r="420" fill="#0e7c74" opacity="0.055"/>
<text x="90" y="120" font-family="Helvetica,Arial,sans-serif" font-size="22" letter-spacing="9" fill="#7d7770">MEMENT</text>
<text x="90" y="278" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="600" fill="#2b2b2b">Anyone. Healthy.</text>
<text x="90" y="356" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="600" fill="#2b2b2b">For a long time.</text>
<text x="90" y="428" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#0e7c74">Medicine does not have to be expensive.</text>
<line x1="90" y1="486" x2="1110" y2="486" stroke="#e5e1da" stroke-width="1"/>
<text x="90" y="536" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#2b2b2b">Agents run our clinics. People meet patients and take responsibility.</text>
<text x="90" y="576" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#7d7770">Ask ours anything &#8212; including what does not work.</text>
</svg>
